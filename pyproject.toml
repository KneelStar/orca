[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-server-manager"
version = "0.2.0"
description = "Orca orchestrator and independent Orca Client"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
orca = "orca_app.cli:orchestrator"
orca-client = "orca_app.cli:client"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["orca_app*"]

[tool.setuptools.package-data]
orca_app = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
