services:
  orchestrator:
    image: ${ORCA_IMAGE:-orca:0.2.3}
    build: .
    restart: unless-stopped
    ports:
      - "${ORCA_BIND_IP:-0.0.0.0}:${ORCA_PORT:-8000}:8000"
    environment:
      ORCA_ROLE: orchestrator
      ORCA_ADMIN_PASSWORD: ${ORCA_ADMIN_PASSWORD:?Set ORCA_ADMIN_PASSWORD}
      ORCA_SESSION_SECRET: ${ORCA_SESSION_SECRET:?Set ORCA_SESSION_SECRET}
      ORCA_ADMIN_TITLE: ${ORCA_ADMIN_TITLE:-Your fleet}
      ORCA_PUBLIC_TITLE: ${ORCA_PUBLIC_TITLE:-Your home base}
      ORCA_COOKIE_SECURE: ${ORCA_COOKIE_SECURE:-false}
    volumes:
      - orca-data:/data
volumes:
  orca-data:
